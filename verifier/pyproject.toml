[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlock-verifier"
version = "0.1.0"
description = "Gridlock GPU Verifier CLI and Grader API"
authors = [{ name = "Gridlock Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "eth-account>=0.13.0",
    "web3>=6.20.0",
    "requests>=2.32.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
gridlock-verify = "cli.main:main"
