# Core entities for Gridlock GPU Forward Marketplace

"""
Represents a GPU infrastructure provider staking collateral and delivering GPU compute hours.
"""
type Provider @entity {
  id: ID!
  name: String!
  minted: BigInt!
  passes: Int!
  degraded: Int!
  fails: Int!
  timeouts: Int!
  hoursDelivered: BigInt!
  slashedTotal: BigInt!
}

"""
Represents a GPU-hour forward series (e.g. gT4-NOW, gH100-W43).
"""
type Series @entity {
  id: ID!
  symbol: String!
  gpuClass: String!
  token: String!
  market: String
  lastPrice: BigInt
  openHours: BigInt!
}

"""
Represents an individual GPU-hour delivery lifecycle from redemption to settlement.
"""
type Delivery @entity {
  id: ID!
  series: Series!
  buyer: String!
  provider: Provider!
  hours: BigInt!
  status: String!
  verdict: Int
  tflopsE2: Int
  toBuyer: BigInt
  toProvider: BigInt
}

"""
Represents an oracle price publication for a given GPU class on a given day.
"""
type IndexPrint @entity {
  id: ID!
  gpuClass: String!
  dayKey: BigInt!
  priceE8: BigInt!
}

"""
Represents an orderbook trade execution.
"""
type Trade @entity {
  id: ID!
  market: String!
  price: BigInt!
  size: BigInt!
  timestamp: BigInt!
}
